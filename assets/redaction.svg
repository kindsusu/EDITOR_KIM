<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9aa6"/>
    </marker>
  </defs>
  <rect width="1100" height="440" fill="#1b1b1f"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#e8e8ec">True redaction — four steps, one text object</text>

  <!-- step 1 -->
  <g transform="translate(32 76)">
    <rect width="236" height="196" rx="10" fill="#232329" stroke="#33333b"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#d97757">1 · select</text>
    <rect x="14" y="44" width="208" height="46" rx="4" fill="#fff"/>
    <text x="24" y="74" font-size="15" fill="#222" font-family="Consolas, monospace" xml:space="preserve">900101-1234567</text>
    <rect x="85" y="53" width="70" height="30" fill="none" stroke="#d97757" stroke-width="2"/>
    <text x="14" y="116" font-size="11.5" fill="#e8e8ec">Characters [7, 14) chosen</text>
    <text x="14" y="134" font-size="11.5" fill="#e8e8ec">in the edit panel. (fake number)</text>
    <text x="14" y="162" font-size="11" fill="#9a9aa6">char boxes come from PDFium:</text>
    <text x="14" y="178" font-size="11" fill="#9a9aa6">FPDFText_GetTextObject + GetCharBox</text>
  </g>

  <!-- step 2 -->
  <g transform="translate(300 76)">
    <rect width="236" height="196" rx="10" fill="#232329" stroke="#33333b"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#d97757">2 · split the text object</text>
    <rect x="14" y="44" width="208" height="46" rx="4" fill="#fff"/>
    <text x="24" y="74" font-size="15" fill="#222" font-family="Consolas, monospace">900101-</text>
    <rect x="85" y="55" width="70" height="26" fill="none" stroke="#9a9aa6" stroke-dasharray="3 3"/>
    <text x="14" y="116" font-size="11.5" fill="#e8e8ec">prefix keeps the object and font.</text>
    <text x="14" y="134" font-size="11.5" fill="#e8e8ec">removed chars are gone from</text>
    <text x="14" y="152" font-size="11.5" fill="#e8e8ec">the content stream.</text>
    <text x="14" y="172" font-size="11" fill="#9a9aa6">suffix, if any, becomes a new object</text>
    <text x="14" y="187" font-size="11" fill="#9a9aa6">shifted by dx from char boxes · 0.17 pt error</text>
  </g>

  <!-- step 3 -->
  <g transform="translate(568 76)">
    <rect width="236" height="196" rx="10" fill="#232329" stroke="#33333b"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#d97757">3 · add the black rect</text>
    <rect x="14" y="44" width="208" height="46" rx="4" fill="#fff"/>
    <text x="24" y="74" font-size="15" fill="#222" font-family="Consolas, monospace">900101-</text>
    <rect x="85" y="55" width="70" height="26" fill="#000"/>
    <text x="14" y="116" font-size="11.5" fill="#e8e8ec">A filled path object over the</text>
    <text x="14" y="134" font-size="11.5" fill="#e8e8ec">union of the removed boxes.</text>
    <text x="14" y="162" font-size="11" fill="#9a9aa6">tagged with content mark DaepilMask</text>
    <text x="14" y="178" font-size="11" fill="#9a9aa6">→ still selectable after save / reload</text>
  </g>

  <!-- step 4 -->
  <g transform="translate(836 76)">
    <rect width="236" height="196" rx="10" fill="#232329" stroke="#33333b"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#d97757">4 · verify</text>
    <rect x="14" y="44" width="208" height="46" rx="4" fill="#1b1b1f" stroke="#33333b"/>
    <text x="24" y="63" font-size="11" fill="#9a9aa6" font-family="Consolas, monospace">pageText(i).includes(</text>
    <text x="24" y="80" font-size="11" fill="#9a9aa6" font-family="Consolas, monospace">  "1234567")  → false ✔</text>
    <text x="14" y="116" font-size="11.5" fill="#e8e8ec">Page text is re-extracted with</text>
    <text x="14" y="134" font-size="11.5" fill="#e8e8ec">PDFium. If the string is still</text>
    <text x="14" y="152" font-size="11.5" fill="#e8e8ec">there, the UI shows a red warning.</text>
    <text x="14" y="178" font-size="11" fill="#9a9aa6">Repeated after save → reopen in tests</text>
  </g>

  <g stroke="#9a9aa6" stroke-width="1.6" marker-end="url(#a)">
    <line x1="270" y1="172" x2="298" y2="172"/>
    <line x1="538" y1="172" x2="566" y2="172"/>
    <line x1="806" y1="172" x2="834" y2="172"/>
  </g>

  <!-- inset: cover-up -->
  <g transform="translate(32 302)">
    <rect width="1040" height="110" rx="10" fill="#232329" stroke="#5a2323"/>
    <text x="14" y="26" font-size="13" font-weight="700" fill="#e07a7a">What DAEPIL does not do: cover-up</text>
    <rect x="14" y="40" width="208" height="46" rx="4" fill="#fff"/>
    <text x="24" y="70" font-size="15" fill="#222" font-family="Consolas, monospace">900101-</text>
    <rect x="85" y="51" width="70" height="26" fill="#000" opacity="0.92"/>
    <text x="88" y="70" font-size="15" fill="#666" font-family="Consolas, monospace" opacity="0.6">1234567</text>
    <text x="240" y="54" font-size="12" fill="#e8e8ec">A rectangle drawn over intact text looks identical on screen.</text>
    <text x="240" y="74" font-size="12" fill="#e8e8ec">Ctrl+A, Ctrl+F and every text extractor still return the number.</text>
    <text x="240" y="94" font-size="12" fill="#9a9aa6">Only the rectangle tool for scanned images works this way — and the UI says so.</text>
  </g>
</svg>
