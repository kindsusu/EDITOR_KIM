<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
  <rect width="1200" height="420" fill="#1b1b1f"/>
  <!-- left: name and tagline -->
  <text x="72" y="150" font-size="96" font-weight="700" fill="#d97757">대필</text>
  <text x="72" y="196" font-size="26" font-weight="600" fill="#e8e8ec" letter-spacing="6">DAEPIL</text>
  <text x="72" y="248" font-size="19" fill="#e8e8ec">True PDF text editing and redaction, on your machine.</text>
  <text x="72" y="278" font-size="19" fill="#e8e8ec">AI through your own Claude Code login. No API key.</text>
  <g font-size="13" fill="#9a9aa6">
    <text x="72" y="330">PDFium (WASM) · Electron · Markdown · Korean-first</text>
    <text x="72" y="354">github.com/kindsusu/DAEPIL</text>
  </g>

  <!-- right: stylized three-column UI -->
  <g transform="translate(640 48)">
    <rect width="512" height="324" rx="12" fill="#232329" stroke="#33333b"/>
    <!-- title bar -->
    <rect x="0" y="0" width="512" height="34" rx="12" fill="#232329"/>
    <text x="16" y="23" font-size="13" font-weight="700" fill="#d97757">대필</text>
    <text x="52" y="23" font-size="11" fill="#9a9aa6">PDF · Markdown</text>
    <text x="330" y="23" font-size="10" fill="#9a9aa6">Claude Code · logged in · no API key</text>
    <line x1="0" y1="34" x2="512" y2="34" stroke="#33333b"/>
    <!-- sidebar -->
    <rect x="0" y="35" width="104" height="289" fill="#232329"/>
    <line x1="104" y1="35" x2="104" y2="324" stroke="#33333b"/>
    <g font-size="9.5" fill="#e8e8ec">
      <rect x="10" y="46" width="84" height="16" rx="4" fill="#2e2e37"/>
      <text x="18" y="57.5" fill="#e8e8ec">📂 파일 열기</text>
      <text x="14" y="86">📄 계약서.pdf</text>
      <rect x="8" y="94" width="88" height="16" rx="4" fill="#34343e"/>
      <text x="14" y="105.5">📄 회의록.pdf</text>
      <text x="14" y="126">📝 보고서.md</text>
    </g>
    <!-- page -->
    <rect x="105" y="35" width="270" height="289" fill="#3a3a40"/>
    <rect x="124" y="52" width="232" height="300" fill="#ffffff"/>
    <g fill="#222">
      <rect x="140" y="70" width="150" height="9" rx="1"/>
      <rect x="140" y="92" width="200" height="4" rx="1" fill="#555"/>
      <rect x="140" y="102" width="188" height="4" rx="1" fill="#555"/>
      <rect x="140" y="112" width="86" height="4" rx="1" fill="#555"/>
      <rect x="230" y="112" width="60" height="6" rx="1" fill="#000"/>   <!-- redaction bar -->
      <rect x="294" y="112" width="40" height="4" rx="1" fill="#555"/>
      <rect x="140" y="132" width="120" height="6" rx="1"/>
      <!-- selected line -->
      <rect x="138" y="146" width="206" height="10" fill="none" stroke="#d97757" stroke-width="1.5"/>
      <rect x="140" y="148" width="200" height="4" rx="1" fill="#555"/>
      <rect x="140" y="158" width="170" height="4" rx="1" fill="#555"/>
    </g>
    <!-- edit panel -->
    <g transform="translate(150 170)">
      <rect width="196" height="86" rx="7" fill="#232329" stroke="#d97757"/>
      <text x="10" y="17" font-size="10" font-weight="700" fill="#e8e8ec">이 줄 고치기</text>
      <text x="90" y="17" font-size="8" fill="#9a9aa6">MalgunGothic · 10pt</text>
      <rect x="10" y="24" width="176" height="22" rx="4" fill="#ffffff"/>
      <text x="16" y="39" font-size="9" fill="#222">정비비 원인 분석 보고 — 9/11</text>
      <rect x="10" y="54" width="52" height="16" rx="4" fill="#d97757"/>
      <text x="17" y="65.5" font-size="8.5" fill="#fff">적용 (Enter)</text>
      <rect x="66" y="54" width="44" height="16" rx="4" fill="#2e2e37" stroke="#33333b"/>
      <text x="72" y="65.5" font-size="8.5" fill="#e8e8ec">취소 (Esc)</text>
      <rect x="114" y="54" width="72" height="16" rx="4" fill="#2e2e37" stroke="#33333b"/>
      <text x="120" y="65.5" font-size="8.5" fill="#e8e8ec">선택 글자 가리기</text>
    </g>
    <!-- claude panel -->
    <line x1="375" y1="35" x2="375" y2="324" stroke="#33333b"/>
    <text x="388" y="56" font-size="11" font-weight="700" fill="#e8e8ec">Claude</text>
    <text x="458" y="56" font-size="9" fill="#9a9aa6">Sonnet 5</text>
    <rect x="386" y="68" width="116" height="34" rx="7" fill="#2a2a32" stroke="#33333b"/>
    <text x="394" y="82" font-size="8.5" fill="#e8e8ec">문서를 열고 질문하거나</text>
    <text x="394" y="94" font-size="8.5" fill="#e8e8ec">편집을 지시하세요.</text>
    <rect x="410" y="110" width="92" height="22" rx="7" fill="#3b3b48"/>
    <text x="418" y="124.5" font-size="8.5" fill="#e8e8ec">격식체로 고쳐줘</text>
    <rect x="386" y="140" width="116" height="46" rx="7" fill="#2a2a32" stroke="#33333b"/>
    <text x="394" y="154" font-size="8.5" fill="#e8e8ec">수정안을 만들었습니다.</text>
    <text x="394" y="166" font-size="8.5" fill="#e8e8ec">확인 후 Enter로 확정.</text>
    <text x="394" y="180" font-size="7.5" fill="#9a9aa6">claude-sonnet-5 · 2.1s · $0.00</text>
    <rect x="386" y="278" width="116" height="30" rx="7" fill="#1b1b1f" stroke="#33333b"/>
    <text x="394" y="296" font-size="8.5" fill="#9a9aa6">지시를 입력…</text>
  </g>
</svg>
