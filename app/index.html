<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>EDITOR_KIM</title>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/font-editor.js"></script>
<style>
  :root{--bg:#1b1b1f;--panel:#232329;--line:#33333b;--fg:#e8e8ec;--mut:#9a9aa6;--acc:#d97757;--add:#1f4d2e;--del:#5a2323}
  *{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:220px 1fr 380px;grid-template-rows:40px minmax(0,1fr);font:13px/1.5 system-ui,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--fg)}
  body.ai-collapsed{grid-template-columns:220px 1fr 0}body.ai-collapsed .ai{display:none}
  #modelPicker{min-width:145px;max-width:260px}#aiToggle.on{background:var(--acc);border-color:var(--acc);color:#fff}
  #aiRailToggle{position:fixed;z-index:8;right:380px;top:50%;width:26px;height:72px;padding:0;border-radius:8px 0 0 8px;transform:translateY(-50%);background:var(--panel);border-right:0;font-size:20px;box-shadow:-2px 2px 8px #0005}
  body.ai-collapsed #aiRailToggle{right:0}#aiRailToggle:hover{background:#3a3a45}
  header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header b{color:var(--acc);font-size:15px}header span{color:var(--mut)}header .sp{flex:1}
  aside{border-right:1px solid var(--line);background:var(--panel);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
  aside h4{margin:4px 6px;color:var(--mut);font-weight:500;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  aside .f{position:relative;padding:6px 22px 6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}aside .f:hover{background:#2c2c34}aside .f.on{background:#34343e}
  aside .f .x{display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--mut);padding:0 4px}
  aside .f:hover .x{display:inline}aside .f .x:hover{color:var(--fg)}
  aside details{margin:2px 6px}aside summary{cursor:pointer;color:var(--mut);font-size:11px;padding:4px 2px;list-style-position:outside}
  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .bar{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);color:var(--mut)}.bar .sp{flex:1}
  button{background:#2e2e37;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}button:hover{background:#3a3a45}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5;cursor:default}
  select{background:#2e2e37;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px;font:inherit}
  .split{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  textarea{width:100%;height:100%;resize:none;border:0;border-right:1px solid var(--line);background:var(--bg);color:var(--fg);padding:18px;font:13px/1.6 Consolas,'D2Coding',monospace;outline:none}
  .prev{overflow:auto;padding:18px 26px;background:#fff;color:#222}.prev h1,.prev h2{margin-top:.6em}.prev table{border-collapse:collapse}.prev td,.prev th{border:1px solid #ccc;padding:3px 8px}
  .pdf{position:relative;flex:1;overflow:auto;background:#3a3a40;padding:20px;text-align:center} /* relative: 페이지 offsetTop이 이 스크롤 영역 기준이 되어 확대 시 커서 위치 고정에 쓴다 */
  #zoomPct{display:inline-block;min-width:44px;text-align:center;cursor:pointer}#zoomPct:hover{color:var(--fg)}
  #stop{background:#5a2323;border-color:#7a3030}#stop:hover{background:#6e2c2c}
  .pdfPage{position:relative;display:inline-block;background:#fff;box-shadow:0 2px 12px #0008;margin-bottom:16px}.pdfPage img{display:block;width:100%;height:100%}
  .pdfBox{position:absolute}.pdfBox:hover{outline:1px solid var(--acc)}
  .pdfBox.editing{outline:2px solid var(--acc)}
  .pdfBox.multi{outline:2px solid #4c9be8;background:rgba(76,155,232,.12)}
  .pdfBox.hiddenText:hover{outline:1px dashed var(--acc)} /* 투명 글자는 올렸을 때만 점선 (평소엔 다른 상자처럼 보이지 않게) */
  .pdfMask{border:1px dashed transparent;cursor:move}.pdfMask:hover{border-color:var(--acc)}
  .pdfMask.editing{background:rgba(255,255,255,.55)}
  .pdfEditor{position:absolute;z-index:6;min-width:340px;max-width:90%;background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:10px;box-shadow:0 6px 24px #0008;color:var(--fg);font:13px/1.5 system-ui,'Malgun Gothic',sans-serif}
  .pdfEditor h5{margin:0 0 2px;font-size:13px;font-weight:600}
  .pdfEditor .hint2{color:var(--mut);font-size:11px;margin-bottom:8px}
  .pdfEditor textarea{width:100%;min-height:2.6em;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px/1.4 system-ui,'Malgun Gothic',sans-serif;background:#fff;color:#222}
  .pdfEditor .row{display:flex;gap:6px;margin-top:8px;align-items:center}
  .pdfEditor .tip{color:var(--mut);font-size:11px;margin-top:6px}
  .diff{flex:1;overflow:auto;padding:12px 18px;font:12px/1.5 Consolas,monospace;white-space:pre-wrap}.diff .a{background:var(--add)}.diff .d{background:var(--del);text-decoration:line-through;opacity:.8}
  .ai{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .ai .bar b{color:var(--fg)}
  .log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{padding:8px 11px;border-radius:10px;max-width:95%;white-space:pre-wrap;word-break:break-word}.me{align-self:flex-end;background:#3b3b48}.bot{align-self:flex-start;background:#2a2a32;border:1px solid var(--line)}.bot small{display:block;color:var(--mut);margin-top:6px}
  .ask{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
  .ask textarea{height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
  .ask .row{display:flex;gap:6px;align-items:center}.ask label{color:var(--mut);display:flex;gap:4px;align-items:center}
  .hint{color:var(--mut);font-size:11px;padding:0 12px 8px}
  #setup{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}
  #setup .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 32px;width:520px;line-height:1.7}
  #setup h2{margin:0 0 8px;color:var(--acc)}#setup p{color:var(--mut);margin:6px 0}#setup .row{display:flex;gap:8px;margin-top:16px}#setup .st{padding:10px 12px;background:#1b1b1f;border-radius:8px;margin:12px 0;font-family:Consolas,monospace;font-size:12px}
  .ok{color:#7cc47f}.bad{color:#e07a7a}
  [hidden]{display:none!important}
  #fontEditor{width:min(820px,95vw);max-height:90vh;overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:24px}
  #fontEditor::backdrop{background:#000a}#fontEditor h3{margin-top:0}#fontEditor label{display:flex;gap:8px;align-items:center}
  #fontEditor .fontText{flex:1;min-width:0}#fontEditor .fontControls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
  #fontEditor .fontSelect{max-width:360px}#fontEditor .fontSize{width:80px}#fontEditor .fontDisclosure{color:var(--mut);font-size:12px}
  #fontEditor .fontCompare{display:grid;gap:12px;margin:16px 0}#fontEditor figure{margin:0}#fontEditor figcaption{color:var(--mut);margin-bottom:5px}
  #fontEditor img{max-width:100%;max-height:180px;object-fit:contain;background:white}#fontEditor .fontCandidates{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body class="ai-collapsed">
<header><b>EDITOR_KIM</b><span id="ver" style="color:var(--acc);opacity:.8"></span><span>PDF · Markdown 편집기</span><span class="sp"></span><span id="status">AI 상태 확인 중…</span><select id="modelPicker" title="Claude 또는 ChatGPT(Codex) 모델 선택"><option value="">Select Model</option></select><button id="aiToggle" aria-controls="aiPanel" aria-expanded="false" title="AI 채팅 패널 열기/닫기 (Ctrl+J)">💬 채팅</button></header>
<aside>
  <button id="openFiles" hidden>📂 파일 열기</button>
  <button id="openFolder" hidden>📁 폴더 열기</button>
  <details id="recentDetails" hidden><summary>최근 파일</summary><div id="recentList"></div></details>
  <h4 id="wsPath" title=""></h4>
  <div id="files"></div>
</aside>
<main>
  <div class="bar"><span id="fname">파일을 선택하세요</span><span id="dirty" hidden>●</span><span class="sp"></span>
    <span id="pdfZoom" hidden><button id="zoomOut" title="축소 (Ctrl+− 또는 Ctrl+휠)">−</button> <span id="zoomPct" title="클릭하면 100%">150%</span> <button id="zoomIn" title="확대 (Ctrl+= 또는 Ctrl+휠)">+</button> <button id="zoomFit" title="페이지 폭을 화면에 맞춤 (Ctrl+0)">폭 맞춤</button></span>
    <button id="undoBtn" hidden disabled>↶ 실행 취소</button>
    <button id="redoBtn" hidden disabled>↷ 다시 실행</button>
    <button id="rectTool" hidden>▭ 마스킹 삽입</button>
    <select id="maskColor" hidden title="가림 색: 검정 또는 그 자리의 배경색을 자동 추출"><option value="black">가림: 검정</option><option value="auto">가림: 배경색</option></select>
    <button id="save" hidden>저장 (Ctrl+S)</button>
    <button id="saveAs" hidden>다른 이름으로 저장 (Ctrl+Shift+S)</button>
    <span id="diffbar" hidden><button id="reject">취소</button> <button id="accept" class="pri">변경 적용</button></span>
  </div>
  <div class="split" id="md" hidden><textarea id="src" spellcheck="false"></textarea><div class="prev" id="prev"></div></div>
  <div class="pdf" id="pdf" hidden></div>
  <div class="diff" id="diff" hidden></div>
</main>
<button id="aiRailToggle" type="button" aria-controls="aiPanel" aria-expanded="false" title="AI 패널 펼치기">‹</button>
<section class="ai" id="aiPanel">
  <div class="bar"><b id="aiTitle">AI</b><span class="sp"></span><button id="newChat" title="이 문서의 대화 기록을 지우고 새로 시작">새 대화</button><button id="aiClose" title="AI 패널 닫기 (Ctrl+J)">×</button></div>
  <div class="log" id="log"><div class="msg bot">문서를 열고 질문하거나, Markdown이면 <b>편집 모드</b>로 수정을 지시하세요.</div></div>
  <div class="hint" id="aiHint">구독 로그인으로 호출하며 API 키를 저장하지 않습니다.</div>
  <div class="ask">
    <textarea id="q" placeholder="예) 2문단을 더 격식 있게 고쳐줘 / 이 문서 3줄 요약  (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
    <div class="row"><label><input type="radio" name="mode" value="chat" checked>질문</label><label><input type="radio" name="mode" value="edit" id="editRadio"><span id="editRadioLabel">편집(MD)</span></label><span class="sp"></span><button id="stop" hidden title="응답 생성 중지 (Esc)">■ 중지</button><button id="send" class="pri">보내기</button></div>
  </div>
</section>

<div id="setup" hidden><div class="card">
  <h2 id="setupTitle">AI 모델 준비</h2>
  <p>API 키 대신 PC에 로그인된 구독 계정을 사용합니다.</p>
  <select id="setupProvider"><option value="claude">Claude Code</option><option value="codex">ChatGPT (Codex)</option></select>
  <div class="st" id="setupStatus">확인 중…</div>
  <p id="setupHelp"></p>
  <div class="row"><button id="btnInstall" class="pri" hidden>1. 설치</button><button id="btnLogin" class="pri" hidden>2. 로그인</button><button id="btnRecheck">다시 확인</button><span class="sp"></span><button id="btnSkip">닫기</button></div>
  <p style="font-size:11px">설치는 Windows 공식 패키지 관리자(WinGet)로 진행됩니다. PowerShell이나 관리자 권한은 필요 없습니다.</p>
</div></div>

<script type="module">
const $ = (s) => document.querySelector(s);
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 상단 상태 표시: setStatus는 기본 문구, flash는 잠깐 보였다가 기본 문구로 돌아간다.
// (flash가 겹치면 이전 flash 문구가 기본 문구인 줄 알고 되돌리던 문제 → 기본 문구를 따로 기억하고 타이머는 하나만 둔다)
let statusBase = '', statusTimer = 0;
function setStatus(text) { statusBase = text; if (!statusTimer) $('#status').textContent = text; }
function flash(text, ms = 1500) {
  clearTimeout(statusTimer); $('#status').textContent = text;
  statusTimer = setTimeout(() => { statusTimer = 0; $('#status').textContent = statusBase; }, ms);
}
// 서버 POST 공통: JSON 응답을 돌려주고, HTTP 오류나 {error}면 상태줄에 알린 뒤 예외를 던진다 (조용히 성공한 척하지 않는다)
async function apiPost(path, payload) {
  let r; try { r = await fetch(path, { method: 'POST', body: JSON.stringify(payload) }); } catch (error) { flash('⚠ 서버에 연결할 수 없습니다', 4000); throw error; }
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.error) { const message = data.error || `HTTP ${r.status}`; flash('⚠ ' + message, 5000); throw new Error(message); }
  return data;
}
// AI 패널은 실행할 때마다 접힌 상태로 시작. 상단 버튼·옆 탭·Ctrl+J로 언제든 토글한다.
function setAiOpen(open) {
  document.body.classList.toggle('ai-collapsed', !open);
  $('#aiToggle').classList.toggle('on', open);
  $('#aiToggle').setAttribute('aria-expanded', String(open));
  $('#aiRailToggle').setAttribute('aria-expanded', String(open));
  $('#aiRailToggle').textContent = open ? '›' : '‹';
  $('#aiRailToggle').title = open ? 'AI 패널 접기' : 'AI 패널 펼치기';
}
setAiOpen(false); localStorage.removeItem('editorkim.ai');
$('#aiToggle').onclick = () => setAiOpen(document.body.classList.contains('ai-collapsed'));
$('#aiRailToggle').onclick = () => setAiOpen(document.body.classList.contains('ai-collapsed'));
$('#aiClose').onclick = () => setAiOpen(false);
document.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key.toLowerCase() === 'j') { e.preventDefault(); $('#aiToggle').click(); } });
let cur = null, docText = '', savedText = '', pending = null;
const ZOOM_MIN = 0.5, ZOOM_MAX = 3, ZOOM_DEFAULT = 1.5;
const clampZoom = (s) => Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round((+s || ZOOM_DEFAULT) * 100) / 100));
let pdfPages = [], pdfObjects = [], pdfScale = clampZoom(localStorage.getItem('editorkim.zoom')), pdfDirty = false, selectedObj = null, selectedMask = null, pdfRenderGeneration = 0;
let rectMode = false, rectDrag = null;
// 미저장 여부·실행취소 스택은 서버(/api/pdf/info)가 정본이다. 새로고침이나 목록에서 닫았다가 다시 열어도 화면이 서버 상태와 어긋나지 않는다
let aiHealth = null, activeAi = null, setupTarget = 'codex', setupExplicit = false, setupBusy = false, loginPoll = 0;
const dirty = () => cur && (cur.endsWith('.pdf') ? pdfDirty : docText !== savedText);
window.isDirty = dirty;
const showDirty = () => { $('#dirty').hidden = !dirty(); };

// ---- AI 공급자·모델 선택과 설치·로그인 검사 ----
const providerName = (provider) => provider === 'codex' ? 'ChatGPT (Codex)' : 'Claude Code';
const choiceValue = (provider, model) => `${provider}:${model}`;
function readChoice(value) {
  const at = value.indexOf(':');
  return at < 0 ? null : { provider: value.slice(0, at), model: value.slice(at + 1) };
}
function activeProvider() { return activeAi && aiHealth?.providers?.[activeAi.provider]; }
function syncAiState() {
  const state = activeProvider(), ready = !!state?.loggedIn;
  $('#send').disabled = !cur || !ready;
  if (!activeAi) { $('#aiTitle').textContent = 'AI'; setStatus('Select Model에서 AI를 선택하세요'); return; }
  const model = state?.models?.find((item) => item.id === activeAi.model);
  $('#aiTitle').textContent = `${providerName(activeAi.provider)} · ${model?.name || activeAi.model || '기본 모델'}`;
  $('#aiHint').textContent = activeAi.provider === 'claude'
    ? '비용은 API 환산액입니다. Claude 구독으로 호출하며 API 키를 저장하지 않습니다.'
    : 'PC의 ChatGPT 로그인과 Codex 사용량을 이용하며 API 키를 저장하지 않습니다.';
  setStatus(ready
    ? `${providerName(activeAi.provider)} ${state.version || ''} · ${state.authMethod || '구독'} 로그인 · API 키 없음`
    : `${providerName(activeAi.provider)} 설정 필요`);
}
function renderModelPicker(preferredProvider) {
  const picker = $('#modelPicker'), saved = localStorage.getItem('editorkim.aiChoice');
  picker.innerHTML = '<option value="">Select Model</option>';
  const available = [];
  for (const provider of ['claude', 'codex']) {
    const state = aiHealth?.providers?.[provider] || { models: [] };
    const group = document.createElement('optgroup'); group.label = providerName(provider);
    if (state.loggedIn) {
      const models = state.models?.length ? state.models : [{ id: '', name: '기본 모델', isDefault: true }];
      for (const model of models) {
        const option = document.createElement('option'); option.value = choiceValue(provider, model.id);
        option.textContent = `${model.name}${model.isDefault ? ' (기본)' : ''}`; group.appendChild(option); available.push({ provider, model });
      }
    } else {
      const option = document.createElement('option'); option.value = `setup:${provider}`;
      option.textContent = state.installed ? '로그인 설정…' : '설치 및 로그인 설정…'; group.appendChild(option);
    }
    picker.appendChild(group);
  }
  const values = [...picker.options].map((option) => option.value);
  let selected = preferredProvider && available.find((item) => item.provider === preferredProvider && item.model.isDefault);
  selected ||= values.includes(saved) ? { value: saved } : null;
  selected ||= available.find((item) => item.provider === 'claude' && item.model.isDefault);
  selected ||= available.find((item) => item.model.isDefault) || available[0];
  const value = selected?.value || (selected ? choiceValue(selected.provider, selected.model.id) : '');
  picker.value = value; activeAi = value ? readChoice(value) : null;
  if (value) localStorage.setItem('editorkim.aiChoice', value);
  syncAiState();
}
function renderSetup() {
  const state = aiHealth?.providers?.[setupTarget] || {};
  $('#setupStatus').classList.remove('bad');
  $('#setupProvider').value = setupTarget; $('#setupTitle').textContent = `${providerName(setupTarget)} 준비`;
  $('#btnInstall').textContent = `1. ${setupTarget === 'codex' ? 'Codex' : 'Claude Code'} 설치`;
  $('#btnLogin').textContent = `2. ${setupTarget === 'codex' ? 'ChatGPT' : 'Claude'} 로그인`;
  $('#btnInstall').hidden = !!state.installed; $('#btnLogin').hidden = !state.installed || !!state.loggedIn;
  $('#btnInstall').disabled = $('#btnLogin').disabled = $('#btnRecheck').disabled = setupBusy;
  $('#setupStatus').innerHTML = state.installed
    ? `<span class="ok">✔ 설치됨</span> ${escapeHtml(state.version || '')}<br>${state.loggedIn ? `<span class="ok">✔ 로그인됨</span> (${escapeHtml(state.authMethod || '구독')})` : '<span class="bad">✘ 로그인 안 됨</span>'}`
      + (state.error ? `<br><span class="bad">모델 목록을 가져오지 못했습니다: ${escapeHtml(state.error)}</span>` : '')
    : `<span class="bad">✘ ${providerName(setupTarget)}가 설치되어 있지 않습니다</span>`;
  $('#setupHelp').textContent = !state.installed ? '[설치]를 누르면 WinGet이 공식 패키지를 설치합니다.'
    : !state.loggedIn ? (setupTarget === 'codex'
      ? '[로그인]을 누른 뒤 브라우저에서 ChatGPT 구독 계정으로 로그인하세요.'
      : '[로그인]을 누른 뒤 브라우저에서 Claude 구독 계정으로 로그인하세요.') : '사용할 준비가 됐습니다.';
}
function showSetup(provider, explicit = true) { setupTarget = provider; setupExplicit = explicit; renderSetup(); $('#setup').hidden = false; }

// 예외: 같은 그룹 마크(EditorKimGroup)를 가진 객체들 — 줄바꿈 편집으로 생긴 줄들, 사용자가 Shift 클릭으로 묶은 상자들 — 은 상자 하나.

  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) out.push([' ', A[i++]]), j++; else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', A[i++]]); else out.push(['+', B[j++]]); }
  while (i < n) out.push(['-', A[i++]]); while (j < m) out.push(['+', B[j++]]);
  return out;
}
function showDiff(oldT, newT) {
  pending = newT; const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  $('#diff').innerHTML = lineDiff(oldT, newT).map(([k, l]) => `<div class="${k === '+' ? 'a' : k === '-' ? 'd' : ''}">${k} ${esc(l) || ' '}</div>`).join('');
  $('#md').hidden = true; $('#diff').hidden = false; $('#diffbar').hidden = false;
}
$('#accept').onclick = () => { $('#src').value = docText = pending; preview(); closeDiff(); showDirty(); flash('변경 적용됨 (Ctrl+S로 저장)'); };
$('#reject').onclick = closeDiff;
function closeDiff() { pending = null; $('#diff').hidden = true; $('#diffbar').hidden = true; $('#md').hidden = false; }

checkHealth(); initFiles();
</script>
